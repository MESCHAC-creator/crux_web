<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- ═══════════════════════════════════════════════════
       VIEWPORT — iOS safe area + no user-scale
  ═══════════════════════════════════════════════════ -->

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- ═══════════════════════════════════════════════════
       iOS PWA / HOME SCREEN
  ═══════════════════════════════════════════════════ -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CRUX" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Apple Touch Icons (multiple sizes for all devices) -->
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/icons/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/apple-touch-icon-180.png" />

  <!-- iOS Splash Screens (portrait) -->
  <!-- iPhone 15 Pro Max -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    href="%PUBLIC_URL%/splash/splash-1290x2796.png" />
  <!-- iPhone 14 / 15 -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    href="%PUBLIC_URL%/splash/splash-1170x2532.png" />
  <!-- iPhone SE -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    href="%PUBLIC_URL%/splash/splash-750x1334.png" />
  <!-- iPad Pro 12.9" -->
  <link rel="apple-touch-startup-image"
    media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
    href="%PUBLIC_URL%/splash/splash-2048x2732.png" />

  <!-- ═══════════════════════════════════════════════════
       PWA MANIFEST
  ═══════════════════════════════════════════════════ -->
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <!-- Favicon -->
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

  <!-- ═══════════════════════════════════════════════════
       SEO / SOCIAL
  ═══════════════════════════════════════════════════ -->
  <title>CRUX — Visioconférence Premium</title>
  <meta name="description" content="CRUX — Plateforme de visioconférence premium avec réactions, sondages, mode vie privée et gamification." />
  <meta name="theme-color" content="#E74C3C" />
  <meta name="msapplication-TileColor" content="#E74C3C" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="CRUX — Visioconférence Premium" />
  <meta property="og:description" content="Réunions vidéo premium avec réactions, sondages en direct, gamification et mode vie privée." />

  <!-- ═══════════════════════════════════════════════════
       iOS / SAFARI CRITICAL FIXES
  ═══════════════════════════════════════════════════ -->
  <style>
    /* Reset + safe area */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      /* Fix 100vh bug on iOS Safari (address bar eats space) */
      height: -webkit-fill-available;
    }
    body {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      /* Prevent iOS rubber-band scroll on body */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      background: #F8F9FA;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #root {
      min-height: 100vh;
      min-height: -webkit-fill-available;
      /* Respect iOS notch/home bar */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Fix iOS tap highlight */
    * { -webkit-tap-highlight-color: transparent; }

    /* Fix iOS input zoom (prevents zoom on focus when font-size < 16px) */
    input, select, textarea {
      font-size: 16px !important;
    }

    /* Fix iOS button appearance */
    button { -webkit-appearance: none; appearance: none; }

    /* Smooth scrolling on iOS */
    .crux-scroll { -webkit-overflow-scrolling: touch; overflow-y: auto; }
  </style>
</head>
<body>
  <!-- iOS PWA: no JS fallback -->
  <noscript>Activez JavaScript pour utiliser CRUX.</noscript>
  <div id="root"></div>
  <script>
    (function() {
      var r = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (r && r !== location.href) history.replaceState(null, null, r);
    })();
  </script>
</body>
</html>
