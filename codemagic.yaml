workflows:
  crux-web-build-deploy:
    name: CRUX Web — Build & Deploy to GitHub Pages
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      node: 20.11.0
      vars:
        REACT_APP_ZEGO_APP_ID: "2042049519"
        GENERATE_SOURCEMAP: "false"
        SKIP_PREFLIGHT_CHECK: "true"
        DISABLE_ESLINT_PLUGIN: "true"
        CI: "false"
        # Secrets à définir dans Codemagic > App settings > Environment variables :
        #   REACT_APP_ZEGO_SERVER_SECRET  (type Secret)
        #   GITHUB_TOKEN                  (Personal Access Token GitHub, scope: repo)

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: claude/*
          include: true
          source: true

    scripts:
      - name: Vérification de l'environnement
        script: |
          node --version
          npm --version

      - name: Installation des dépendances
        script: npm ci --legacy-peer-deps

      - name: Build de production
        script: npm run build

      - name: Déploiement sur GitHub Pages
        script: |
          if [ "$CM_BRANCH" = "main" ]; then
            echo "Déploiement depuis la branche main..."
            git config --global user.email "codemagic-bot@crux.app"
            git config --global user.name "Codemagic Bot"
            git remote set-url origin https://x-access-token:$GITHUB_TOKEN@github.com/MESCHAC-creator/crux_web.git
            npx gh-pages -d build --message "Deploy [skip ci]"
            echo "Site déployé : https://MESCHAC-creator.github.io/crux_web/"
          else
            echo "Branche $CM_BRANCH — build OK, pas de déploiement."
          fi

    artifacts:
      - build/**

    publishing:
      email:
        recipients:
          - kouakouchristevann@gmail.com
        notify:
          success: true
          failure: true
